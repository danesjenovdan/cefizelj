apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: voda-add-trailing-slash
spec:
  redirectRegex:
    regex: (/referendum/voda)$
    replacement: ${1}/
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: voda-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /referendum/voda
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volitveni-vodic-voda
  annotations:
    # do not put cert manager here, the root redirect owns the tls secret
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd
      vodici-redirect-domain@kubernetescrd
      vodici-voda-add-trailing-slash@kubernetescrd
      vodici-voda-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vodici.djnd.si
      http: &http_paths
        paths:
          - path: /referendum/voda
            pathType: Prefix
            backend:
              service:
                name: volitveni-vodic-voda
                port:
                  number: 80
    - host: vodici.danesjenovdan.si
      http: *http_paths
