apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: predsedniske-1-add-trailing-slash
spec:
  redirectRegex:
    regex: (/volitve/predsedniske/1)(\?.*)?$
    replacement: ${1}/${2}
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: predsedniske-1-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /volitve/predsedniske/1
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volitveni-vodic-predsednik-2022
  annotations:
    # Do not put cert manager here, root redirect ingress (in `ops` repo) will handle it.
    # If we put it here, they will both try to issue the certificate and letsencrypt will rate limit us.
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd,
      vodici-redirect-domain@kubernetescrd,
      vodici-predsedniske-1-add-trailing-slash@kubernetescrd,
      vodici-predsedniske-1-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vodici.danesjenovdan.si
      http:
        paths:
          - path: /volitve/predsedniske/1
            pathType: Prefix
            backend:
              service:
                name: volitveni-vodic-predsednik-2022
                port:
                  number: 80
