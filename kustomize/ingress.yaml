apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rtv-add-trailing-slash
spec:
  redirectRegex:
    regex: (/referendum/rtv)(\?.*)?$
    replacement: ${1}/${2}
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rtv-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /referendum/rtv
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volitveni-vodic-rtv-referendum-2022
  annotations:
    # Do not put cert manager here, root redirect ingress (in `ops` repo) will handle it.
    # If we put it here, they will both try to issue the certificate and letsencrypt will rate limit us.
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd,
      vodici-redirect-domain@kubernetescrd,
      rtv-add-trailing-slash@kubernetescrd,
      rtv-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vodici.danesjenovdan.si
      http:
        paths:
          - path: /referendum/rtv
            pathType: Prefix
            backend:
              service:
                name: volitveni-vodic-rtv-referendum-2022
                port:
                  number: 80
