apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: add-trailing-slash
spec:
  redirectRegex:
    regex: (/referendum/voda)$
    replacement: ${1}/
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: volitveni-vodic-voda
  annotations:
    # do not put cert manager here, the root redirect owns the tls secret
    traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-to-https@kubernetescrd,vodici-redirect-domain@kubernetescrd,vodici-add-trailing-slash@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vodici.djnd.si
      http: &http_paths
        paths:
          - path: /referendum/voda(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: volitveni-vodic-voda
                port:
                  number: 80
    - host: vodici.danesjenovdan.si
      http: *http_paths
